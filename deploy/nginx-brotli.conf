# brotli —— 仅在服务器编译了 nginx-module-brotli 时 include
#
# 启用步骤:
#   1. nginx -V 2>&1 | grep -o brotli        # 必须有输出
#   2. 把这个文件放到 /etc/nginx/conf.d/nginx-brotli.conf:
#      # (a) 服务器上有仓库检出时:
#      sudo cp deploy/nginx-brotli.conf /etc/nginx/conf.d/nginx-brotli.conf
#      # (b) 服务器上**没有**仓库检出时(常见)——先在本地 scp 过去再在服务器上 cp:
#      scp deploy/nginx-brotli.conf <user>@<host>:/tmp/nginx-brotli.conf
#      ssh <user>@<host> 'sudo cp /tmp/nginx-brotli.conf /etc/nginx/conf.d/nginx-brotli.conf'
#      ⚠️ 只写 (a) 会让没有仓库检出的操作员卡在 `No such file or directory`,
#      #   而那个报错看不出真实原因 —— 两种都要写。
#   3. **确认这个文件真的被 include 了**（见下面那段说明,这一步最容易漏）
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. curl -I -H 'Accept-Encoding: br' https://ziyun.pudafo.com/ | grep -i content-encoding
#
# 没有 brotli 模块就不要放这个文件 —— nginx 会因未知指令启动失败。
#
# ⚠️ 第 3 步为什么单独列出来:把文件拷进 conf.d/ 并不等于它生效。
#   只有当线上 nginx.conf 的 http 块里有 `include /etc/nginx/conf.d/*.conf;`
#   (Ubuntu 默认有) 才自动生效;没有的话,必须自己在 ziyun 那个 server 块里
#   加一行 `include /etc/nginx/conf.d/nginx-brotli.conf;`。
#   漏了这一步 ⇒ 文件在那里、指令一条没生效、而且**看不出任何异常**。
#   自检: sudo nginx -T | grep -n 'nginx-brotli' 必须有输出。
#
# ⚠️ `brotli_static on;` 只有在源文件旁边存在预压缩的 .br 时才省 CPU;
#   .br 由 `scripts/precompress-assets.mjs` 在 build 期生成(Task 7)。
#   没有 .br 时 nginx 会退回运行时压缩(功能正常,只是费 CPU)。
brotli on;
brotli_comp_level 6;
brotli_static on;
brotli_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    image/svg+xml;

# Nginx config for ziyun.pudafo.com — 字·韵 (Next.js 15 + React 19)
#
# 放置位置 (Ubuntu/Debian):   /etc/nginx/sites-available/ziyun.pudafo.com.conf
# 启用:                       ln -s .../ziyun.pudafo.com.conf /etc/nginx/sites-enabled/
# 校验 + 加载:                sudo nginx -t && sudo systemctl reload nginx
#
# 设计原则 (与 DEPLOY.md §3 一致):
#   - 后端 Node 只 listen 127.0.0.1:4444,反代对外
#   - TLS 终止在反代,后端 cookie 走 Secure
#   - 大文件 body 上限 500m(导入/备份/批量内容)
#   - 静态资源 (笔顺/笔刷字体 134MB) 1 年 immutable 缓存
#   - WebSocket Upgrade 透传(字帖打印页 Edge TTS 流式)
#   - 公开端点 (/api/auth/ /api/init/) 限流
#   - X-Forwarded-For 真实 IP 透传(audit_log 用)

# ---------------------- 限流 zone 定义 ----------------------
# /api/auth/* 和 /api/init/* 公开,需要限流。每 IP 10 req/min,burst 5。
# 10m 内存足够 ~16 万 unique IP 计数。
limit_req_zone $binary_remote_addr zone=auth_init:10m rate=10r/m;

# ---------------------- 后端 upstream ----------------------
upstream ziyun_app {
    server 127.0.0.1:4444;
    keepalive 32;
}

# ---------------------- 全局静态优化 ----------------------
# sendfile() 零拷贝 — 大字体 (196MB) / 笔顺 JSON (32MB) 收益显著
# tcp_nopush 让 HTTP response header + 第一个文件包合并发出
# gzip + gzip_static:预压缩 (.gz/.br) 文件存在时直接 serving,运行时压缩作 fallback
#   需要 build 期生成 .gz — 见 scripts/static-precompress.sh (TODO 2026-07-05)
sendfile on;
tcp_nopush on;
tcp_nodelay on;
gzip on;
gzip_disable "msie6";
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/rss+xml
    image/svg+xml;
gzip_static on;     # 存在 .gz 就直接发出去 (需 build 期间生成)
# brotli 需要 nginx-module-brotli 编译;先注释:
# brotli on;
# brotli_comp_level 6;
# brotli_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
# brotli_static on;

# ---------------------- HTTP → HTTPS ----------------------
server {
    listen 80;
    listen [::]:80;
    server_name ziyun.pudafo.com;

    # Let's Encrypt 续签需要:验证 /.well-known/acme-challenge/ 走 HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 其余全部 301 跳 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------- HTTPS 主站 ----------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ziyun.pudafo.com;

    # ---- TLS 证书 (Let's Encrypt 标准路径) ----
    ssl_certificate     /etc/letsencrypt/live/ziyun.pudafo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ziyun.pudafo.com/privkey.pem;

    # ---- TLS 协议 + 加密套件 (Mozilla Intermediate profile, 2024 推荐) ----
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;   # TLSv1.3 客户端优先
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- 客户端体量上限 (必须 500m,详见 DEPLOY.md §3.3) ----
    client_max_body_size 500m;

    # ---- 超时 (TTS 30s + PDF 3-10s + Edge TTS WebSocket 流式) ----
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # ---- 真实 IP 透传 ----
    # 如果直接挂在公网(无 CDN),用默认 $proxy_add_x_forwarded_for 即可
    # 如果走 Cloudflare/阿里云 CDN,解注下面 4 行 + 填 CDN IP 段:
    #   set_real_ip_from 173.245.48.0/20;     # Cloudflare
    #   set_real_ip_from 103.21.244.0/22;     # Cloudflare
    #   set_real_ip_from 103.22.200.0/22;     # Cloudflare
    #   set_real_ip_from 103.31.4.0/22;       # Cloudflare
    #   set_real_ip_from 131.0.72.0/22;       # Cloudflare
    #   real_ip_header X-Forwarded-For;
    # CDN 段参考: https://www.cloudflare.com/ips/

    # ---- 静态资源:Nginx 直接 alias 出磁盘,绕开 Node ----
    # 笔顺 JSON 6866 个 (32MB) + 笔刷字体 196MB + 字重 font 22MB,共 ~250MB
    # 不走 Node:免一趟 http loopback + Node express 路由 + 内存拷贝
    # Nginx 用 sendfile() 零拷贝;自带 ETag/304/Range;日志关掉避免 volume
    # 路径对齐 DEPLOY.md §2:`/opt/pinyin-character/` 是安装根
    # 注意 Nginx worker 进程要能读这些目录 (chmod a+rx / chown www-data)

    # /opt/pinyin-character/.next/static/ — Next.js 构建产物 (js/css,hash 在文件名)
    location /_next/static/ {
        alias /opt/pinyin-character/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 笔顺数据 (用户最常访问 6866 个 JSON)
    location /strokes/ {
        alias /opt/pinyin-character/public/strokes/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # OFL 笔刷字体 (196MB,长缓存关键)
    location /fonts/ {
        alias /opt/pinyin-character/public/fonts/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";   # 跨域字体 (CORS 必需)
        access_log off;
        try_files $uri =404;
    }

    # 自定义字重 (22MB,含 fonts.css 1MB)
    location /font/ {
        alias /opt/pinyin-character/public/font/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 音频文件 (admin 上传,运行时写入 public/audio/<id>.mp3)
    # 缓存短些 — 后期可能换音轨
    location /audio/ {
        alias /opt/pinyin-character/public/audio/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # 小图标 / PWA manifest
    location = /logo.png     { alias /opt/pinyin-character/public/logo.png;     expires 1d; access_log off; }
    location = /logo.svg     { alias /opt/pinyin-character/public/logo.svg;     expires 1d; access_log off; }
    location = /favicon.ico  { alias /opt/pinyin-character/public/favicon.ico;  expires 1d; access_log off; }
    location = /manifest.json { alias /opt/pinyin-character/public/manifest.json; expires 1d; access_log off; }

    # ---- 公开端点限流 ----
    location /api/auth/ { limit_req zone=auth_init burst=5 nodelay; proxy_pass http://ziyun_app; }
    location /api/init/ { limit_req zone=auth_init burst=5 nodelay; proxy_pass http://ziyun_app; }

    # ---- 默认:全部其它走 Node (含 WebSocket) ----
    location / {
        proxy_pass http://ziyun_app;
        proxy_http_version 1.1;            # WebSocket 必须 1.1
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;     # WebSocket 透传
        proxy_set_header Connection        "upgrade";
    }
}

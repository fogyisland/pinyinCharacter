# Nginx config for ziyun.pudafo.com — 字·韵 (Next.js 15 + React 19)
#
# ⚠️ 这是一份**模板**,不是线上跑的那份。
#   2026-10-30 实测:线上 /font/、/fonts/、/strokes/、/_next/static/、/audio/、
#   /logo.png 全部由 **Next.js** 提供(ETag 是 `W/"<size-hex>-<mtime-ms-hex>"`、
#   没有 `Expires:`、404 页面带 `X-Powered-By: Next.js`),仓库这份里对应的
#   `alias` 块**在生产上没有生效** ⇒ **不要整份覆盖线上配置**。
#   线上那份配置的真实路径**从未实测过**:从 `sudo nginx -T` 输出的
#   `# configuration file <路径>:` 行读出它,记为 LIVE_CONF,后续所有
#   备份 / 合并 / 回滚命令一律用 "$LIVE_CONF",不要写死任何路径。
#   对账 / 备份 / 合并 / nginx -t + reload / 冒烟 / 回滚 的完整流程见
#   deploy/OPTIMIZATION.md
#
# 设计原则 (与 DEPLOY.md §3 一致):
#   - 后端 Node 只 listen 127.0.0.1:4444,反代对外
#   - TLS 终止在反代,后端 cookie 走 Secure
#   - 大文件 body 上限 500m(导入/备份/批量内容)
#   - 静态资源 (笔顺/笔刷字体 134MB) 1 年 immutable 缓存
#   - WebSocket Upgrade 透传(字帖打印页 Edge TTS 流式)
#   - 公开端点 (/api/auth/ /api/init/) 限流
#   - X-Forwarded-For 真实 IP 透传(audit_log 用)

# ---------------------- 限流 zone 定义 ----------------------
# /api/auth/* 和 /api/init/* 公开,需要限流。每 IP 10 req/min,burst 5。
# 10m 内存足够 ~16 万 unique IP 计数。
limit_req_zone $binary_remote_addr zone=auth_init:10m rate=10r/m;

# /mcp 是公开端点(任何注册用户都能拿到 token),渲染 PNG 又很吃内存,
# 必须限流,否则单个账号就能把整个站点拖垮。
# 每 IP 30 req/min,burst 10 —— 一个 MCP 客户端正常用只占其中几个。
limit_req_zone $binary_remote_addr zone=mcp:10m rate=30r/m;

# ---------------------- HTML 微缓存 ----------------------
# Next 对每个 HTML 都发 private,no-store,不忽略它就永远缓存不了。
# 只缓存匿名访问的「文档请求」;带 auth_token 的登录态请求、RSC 飞行请求、
# 以及所有 API 响应都既不读也不写缓存。
# TTL 10 秒 —— 目的是省掉往返与传输,不是做内容分发。
proxy_cache_path /var/cache/nginx/ziyun
    levels=1:2
    keys_zone=ziyun_html:10m
    max_size=64m
    inactive=10m
    use_temp_path=off;

# ---------------------- 后端 upstream ----------------------
upstream ziyun_app {
    server 127.0.0.1:4444;
    keepalive 32;
}

# ---------------------- 全局静态优化 ----------------------
# sendfile() 零拷贝 — 大字体 (196MB) / 笔顺 JSON (32MB) 收益显著
# tcp_nopush 让 HTTP response header + 第一个文件包合并发出
# gzip + gzip_static:预压缩 (.gz/.br) 文件存在时直接 serving,运行时压缩作 fallback
#   需要 build 期生成 .gz/.br — 见 scripts/precompress-assets.mjs
sendfile on;
tcp_nopush on;
tcp_nodelay on;
gzip on;
gzip_disable "msie6";
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/rss+xml
    image/svg+xml;
gzip_static on;     # 存在 .gz 就直接发出去 (需 build 期间生成)
    # brotli 需要 nginx-module-brotli;探测到再 include:
    #   nginx -V 2>&1 | grep -o brotli
    #   两条落地路径(服务器上有/没有仓库检出)见 deploy/OPTIMIZATION.md 第 3 步:
    #     (a) sudo cp deploy/nginx-brotli.conf /etc/nginx/conf.d/nginx-brotli.conf
    #     (b) scp deploy/nginx-brotli.conf <user>@<host>:/tmp/nginx-brotli.conf
    #         ssh <user>@<host> 'sudo cp /tmp/nginx-brotli.conf /etc/nginx/conf.d/nginx-brotli.conf'
    #   放完必须确认真的被 include 了,然后: sudo nginx -t && sudo systemctl reload nginx

# ---------------------- HTTP → HTTPS ----------------------
server {
    listen 80;
    listen [::]:80;
    server_name ziyun.pudafo.com;

    # Let's Encrypt 续签需要:验证 /.well-known/acme-challenge/ 走 HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 其余全部 301 跳 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------- HTTPS 主站 ----------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ziyun.pudafo.com;

    # ---- TLS 证书 (Let's Encrypt 标准路径) ----
    ssl_certificate     /etc/letsencrypt/live/ziyun.pudafo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ziyun.pudafo.com/privkey.pem;

    # ---- TLS 协议 + 加密套件 (Mozilla Intermediate profile, 2024 推荐) ----
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;   # TLSv1.3 客户端优先
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- 客户端体量上限 (必须 500m,详见 DEPLOY.md §3.3) ----
    client_max_body_size 500m;

    # ---- 超时 (TTS 30s + PDF 3-10s + Edge TTS WebSocket 流式) ----
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # ---- 真实 IP 透传 ----
    # 如果直接挂在公网(无 CDN),用默认 $proxy_add_x_forwarded_for 即可
    # 如果走 Cloudflare/阿里云 CDN,解注下面 4 行 + 填 CDN IP 段:
    #   set_real_ip_from 173.245.48.0/20;     # Cloudflare
    #   set_real_ip_from 103.21.244.0/22;     # Cloudflare
    #   set_real_ip_from 103.22.200.0/22;     # Cloudflare
    #   set_real_ip_from 103.31.4.0/22;       # Cloudflare
    #   set_real_ip_from 131.0.72.0/22;       # Cloudflare
    #   real_ip_header X-Forwarded-For;
    # CDN 段参考: https://www.cloudflare.com/ips/

    # ---- 静态资源:Nginx 直接 alias 出磁盘,绕开 Node ----
    # 笔顺 JSON 6866 个 (32MB) + 笔刷字体 196MB + 字重 font 29MB,共 ~260MB
    # 不走 Node:免一趟 http loopback + Node express 路由 + 内存拷贝
    # Nginx 用 sendfile() 零拷贝;自带 ETag/304/Range;日志关掉避免 volume
    # 路径对齐 DEPLOY.md §2:`/opt/pinyin-character/` 是安装根
    # 注意 Nginx worker 进程要能读这些目录 (chmod a+rx / chown www-data)

    # /opt/pinyin-character/.next/static/ — Next.js 构建产物 (js/css,hash 在文件名)
    location /_next/static/ {
        alias /opt/pinyin-character/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 笔顺数据 (用户最常访问 6866 个 JSON)
    location /strokes/ {
        alias /opt/pinyin-character/public/strokes/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # OFL 笔刷字体 (196MB,长缓存关键)
    location /fonts/ {
        alias /opt/pinyin-character/public/fonts/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";   # 跨域字体 (CORS 必需)
        access_log off;
        try_files $uri =404;
    }

    # 自定义字重 (29MB:7 982 个 woff2 + 三份分族样式表)
    # 缓存分两层:字体子集的 URL 字节永不变 ⇒ 一年 immutable;样式表与 manifest
    # 是可变层 ⇒ 30 天。两个块都**不用** `expires`(它自己会再生成一个
    # Cache-Control ⇒ 两个头,与手册实测的「一个」冲突)。长前缀在前。
    # ⚠️ 本模板整份不安装(F30-a)—— 只手工合并需要的那几行。
    location /font/web/ {
        alias /opt/pinyin-character/public/font/web/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location /font/ {
        alias /opt/pinyin-character/public/font/;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }

    # 音频文件 (admin 上传,运行时写入 public/audio/<id>.mp3)
    # 缓存短些 — 后期可能换音轨
    location /audio/ {
        alias /opt/pinyin-character/public/audio/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # 小图标 / PWA manifest
    location = /logo.png     { alias /opt/pinyin-character/public/logo.png;     expires 1d; access_log off; }
    location = /logo.svg     { alias /opt/pinyin-character/public/logo.svg;     expires 1d; access_log off; }
    # UI 用的 96px 小 logo(页头/页脚)。内容由 npm run logo:build 生成,
    # 变更有版本号,缓存 30 天即可。
    location = /logo-sm.webp { alias /opt/pinyin-character/public/logo-sm.webp; expires 30d; access_log off; }
    location = /logo-sm.png  { alias /opt/pinyin-character/public/logo-sm.png;  expires 30d; access_log off; }
    location = /favicon.ico  { alias /opt/pinyin-character/public/favicon.ico;  expires 1d; access_log off; }
    location = /manifest.json { alias /opt/pinyin-character/public/manifest.json; expires 1d; access_log off; }

    # ---- 公开端点限流 ----
    location /api/auth/ { limit_req zone=auth_init burst=5 nodelay; proxy_pass http://ziyun_app; }
    location /api/init/ { limit_req zone=auth_init burst=5 nodelay; proxy_pass http://ziyun_app; }

    # ---- MCP 端点 (SSE 长连接,必须关缓冲) ----
    location /mcp {
        proxy_pass http://ziyun_app;
        limit_req zone=mcp burst=10 nodelay; # 30r/m —— 一个 MCP 客户端正常用只占几个
        client_max_body_size 5m;           # 端点自己限 4 MiB;nginx 这层再兜一道底
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_buffering off;               # SSE:默认 on 会把事件攒在缓冲区,客户端收不到流
        proxy_cache off;
        proxy_read_timeout 3600s;          # 覆盖 server 级的 120s
        proxy_send_timeout 3600s;
    }

    # ---- API 一律不缓存 ----
    # location / 下还挂着 73 个带 GET 的 API 路由(控制器 2026-10-30 实测:app/api 下
    # 132 个 route.ts,其中 73 个导出 GET),其中 /api/chars/random、/api/game/round、
    # /api/stats 的语义是「每次给新内容」,缓存会让所有用户拿到同一个值;
    # /api/history、/api/notes、/api/membership/me 是用户态数据。
    # 本块比 location /api/auth/ 与 location /api/init/ 短,nginx 取最长前缀匹配,
    # 那两个限流块不受影响。
    location /api/ {
        proxy_pass http://ziyun_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_cache off;
    }

    # ---- 默认:全部其它走 Node (含 WebSocket) ----
    location / {
        proxy_pass http://ziyun_app;
        proxy_http_version 1.1;            # WebSocket 必须 1.1
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;     # WebSocket 透传
        proxy_set_header Connection        "upgrade";

        # HTML 微缓存(仅匿名、仅文档请求)
        proxy_cache ziyun_html;
        # 缓存键带上 $http_accept_encoding:上游按请求头协商压缩,同一个 URL 会回
        # **两种不同的字节**(带 Accept-Encoding: gzip → gzip 体;不带 → 原始体)。
        # nginx 的 proxy_cache **认** `Vary`(1.7.7 起「按对应的请求头字段分别缓存」),
        # 而上游那行 `Vary: ... Accept-Encoding` 本已提供隔离 ⇒ 把编码**显式**写进
        # 键里是**第二道闸**:它不依赖上游继续发 `Vary`,也不依赖
        # `proxy_ignore_headers` 里没有被加上 `Vary`(加了就会关掉 nginx 那道闸)。
        # ⚠️ 反过来:**`proxy_ignore_headers` 里绝不许加 `Vary`**。
        # 实测见「已实测的线上事实」。
        proxy_cache_key "$scheme$request_method$host$request_uri$http_accept_encoding";
        proxy_cache_valid 200 10s;
        proxy_cache_methods GET HEAD;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # 读:登录态与 RSC 飞行请求都不读缓存
        proxy_cache_bypass $cookie_auth_token $http_rsc;
        # 写:登录态、带 Set-Cookie 的响应、RSC 飞行请求都不写缓存
        # (proxy_cache_bypass 只管读不管写,这一行是必需的第二道闸)
        proxy_no_cache $cookie_auth_token $upstream_http_set_cookie $http_rsc;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control;
        # ⚠️ nginx 的 add_header 只在「本层级没有定义任何 add_header」时才继承父级,
        #    而且只有「替换」语义、没有「追加」语义 ⇒ 这一行会让 location / 继承到的
        #    **http 级与 server 级** add_header 全部消失(HSTS / X-Frame-Options 之类)。
        #    本片段内 http 级 0 条、server 级 0 条、location 级 8 条(全在 location 里),所以不受影响;
        #    线上那份从未实测过 ⇒ 合并前必须先
        #      sudo nginx -T | grep -nE '^[[:space:]]*(http|server|location)[[:space:]].*\{|add_header'
        #    (块头与 add_header 行交错出现 ⇒ 顺着上一行块头判断层级;完整判据见手册第 1.5 步),
        #    并把 http 级与 server 级的那些**逐条复制**到本块里。
        # ⚠️ 不要把这一行提到 server 级:那会让 /api/、/mcp、/font/ 也带上这个头。
        add_header X-Ziyun-Cache $upstream_cache_status always;
    }
}
